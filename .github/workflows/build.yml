name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.1.2）"
        required: false
        default: "1.1.2"
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 列出可用 Xcode，选版本号最大的
          ls /Applications | grep -i "^Xcode" || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        id: ver
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VER="1.1.2"; fi
          BUILD=$(date +%m%d%H)
          echo "VER=$VER" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "version=$VER build=$BUILD"

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "--- 生成结果 ---"
          ls -d *.xcodeproj
          OBJ=$(grep -m1 "objectVersion" *.xcodeproj/project.pbxproj | grep -oE "[0-9]+" | head -1)
          echo "objectVersion = $OBJ"
          # Xcode 15 最高支持 60；若生成的是 70+ 则降级
          if [ -n "$OBJ" ] && [ "$OBJ" -gt 60 ]; then
            echo "工程格式过新（$OBJ），降级为 60"
            sed -i '' "s/objectVersion = $OBJ;/objectVersion = 60;/" *.xcodeproj/project.pbxproj
            grep -m1 "objectVersion" *.xcodeproj/project.pbxproj
          fi

      - name: Apply version to project
        run: |
          echo "应用版本 $VER ($BUILD)"
          # 1. Info.plist 硬编码
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" FHCPEManager/Resources/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VER" FHCPEManager/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" FHCPEManager/Resources/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" FHCPEManager/Resources/Info.plist
          # 2. 工程构建设置（覆盖 XcodeGen 生成的值）
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VER;/g" FHCPEManager.xcodeproj/project.pbxproj
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD;/g" FHCPEManager.xcodeproj/project.pbxproj
          echo "--- 校验 ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" FHCPEManager/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" FHCPEManager/Resources/Info.plist
          grep -m2 "MARKETING_VERSION" FHCPEManager.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project FHCPEManager.xcodeproj \
            -scheme FHCPEManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -arch arm64 \
            build

      - name: Package into IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FHCPEManager.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "构建产物不存在"; ls -R build/Build/Products || true; exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 未签名包移除签名文件
          rm -rf Payload/FHCPEManager.app/_CodeSignature || true
          zip -qry FHCPE-Manager-unsigned.ipa Payload
          ls -lh FHCPE-Manager-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FHCPE-Manager-unsigned-ipa
          path: FHCPE-Manager-unsigned.ipa
          retention-days: 30
