name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.3.0）"
        required: false
        default: "1.3.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then VER="1.3.0"; fi
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VER="1.3.0"; fi
          BUILD=$(date +%m%d%H)
          echo "VER=$VER" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "version=$VER build=$BUILD"

      - name: Clean stray files
        run: |
          find . -name "*.swift.new" -o -name "*.swift.bak" -o -name "*.swift.orig" | xargs -r rm -v
          find . -name "*~" -delete

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -d *.xcodeproj
          OBJ=$(grep -m1 "objectVersion" *.xcodeproj/project.pbxproj | grep -oE "[0-9]+" | head -1)
          echo "objectVersion = $OBJ"
          if [ -n "$OBJ" ] && [ "$OBJ" -gt 60 ]; then
            sed -i '' "s/objectVersion = $OBJ;/objectVersion = 60;/" *.xcodeproj/project.pbxproj
          fi

      - name: Apply version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" FHCPEManager/Resources/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" FHCPEManager/Resources/Info.plist || true
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VER;/g" FHCPEManager.xcodeproj/project.pbxproj
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD;/g" FHCPEManager.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" FHCPEManager/Resources/Info.plist

      - name: Build
        run: |
          xcodebuild \
            -project FHCPEManager.xcodeproj \
            -scheme FHCPEManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -arch arm64 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee /tmp/build.log | tail -50
          exit ${PIPESTATUS[0]}

      - name: Package
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FHCPEManager.app"
          if [ ! -d "$APP_PATH" ]; then ls -R build/Build/Products; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/FHCPEManager.app/_CodeSignature || true
          zip -qry FHCPE-Manager-unsigned.ipa Payload
          ls -lh FHCPE-Manager-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CPE-Manager-ipa
          path: FHCPE-Manager-unsigned.ipa
          retention-days: 30
