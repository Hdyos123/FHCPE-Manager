name: FHCPEManager
options:
  xcodeVersion: "15.0"
  bundleIdPrefix: com.fhcpe
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  FHCPEManager:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FHCPEManager
        excludes:
          - "Resources/Info.plist"
          - "Resources/Bridging-Header.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cpemanager.ultra
        INFOPLIST_FILE: FHCPEManager/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: FHCPEManager/Resources/Bridging-Header.h
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 114
        MARKETING_VERSION: "1.2.7"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
